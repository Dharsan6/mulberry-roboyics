version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: precision_sericulture_backend
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: precision_sericulture_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: precision_sericulture_dashboard
    ports:
      - "8501:8501"
    environment:
      - API_HOST=http://backend:8000
    depends_on:
      - backend
